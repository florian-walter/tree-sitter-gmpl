[package]
authors = [ "Florian P. Walter <florian.p.walter@gmail.com>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "GMPL bindings to the Tree-sitter parsing library"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "gmpl" ]
license = "MIT"
name = "tree-sitter-gmpl"
readme = "README.md"
repository = "https://github.com/florian-walter/tree-sitter-gmpl"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.2"
