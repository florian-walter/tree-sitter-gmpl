[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { email = "florian.p.walter@gmail.com", name = "Florian P. Walter" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "GMPL bindings to the Tree-sitter parsing library"
keywords = [ "incremental", "parsing", "tree-sitter", "gmpl" ]
license.text = "MIT"
name = "tree-sitter-gmpl"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Funding = ""
Homepage = "https://github.com/florian-walter/tree-sitter-gmpl"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
